<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 88" width="500" height="88" fill="none">
  <defs>
    <style>
      .brand-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-slogan {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 1.4px;
      }
    </style>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#d4d4d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2b2b2b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#b3b3b3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Badge -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#iconBg)" stroke="url(#borderGrad)" stroke-width="1.75" />
    <rect x="3" y="3" width="66" height="66" rx="15" fill="none" stroke="#2b2b2b" stroke-width="1" />
    
    <!-- Chevron / Input -->
    <path d="M 21 24 L 36 36 L 21 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Upper Branch -->
    <path d="M 42 22 L 56 36" stroke="#d4d4d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="42" cy="22" r="3.5" fill="#ffffff" />
    
    <!-- Lower Merge Line -->
    <path d="M 36 50 L 56 50" stroke="#b3b3b3" stroke-width="4" stroke-linecap="round" />
    <circle cx="56" cy="36" r="3.5" fill="#ffffff" />
  </g>

  <!-- Seamless Unified Brand Wordmark -->
  <text x="96" y="49" class="brand-title" fill="#ffffff">Auto<tspan fill="url(#textSilver)">mergent</tspan></text>
  
  <!-- Seamless Slogan (Single Text Line, No Offset Breaks) -->
  <text x="98" y="69" class="brand-slogan" fill="#8c8c8c">AUTONOMOUS AGENT <tspan fill="#ffffff" font-weight="900">·</tspan> <tspan fill="#b3b3b3">AI CODING ENGINE</tspan></text>
</svg>