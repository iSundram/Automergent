<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 160" width="100%" style="display:block">
  <rect width="960" height="160" fill="#2b2b2b"/>

  <!-- section label -->
  <text x="24" y="26" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#6c7086" font-size="11">✦  install &amp; quickstart</text>

  <!-- terminal window -->
  <rect x="24" y="38" width="912" height="106" rx="6" fill="#3c3c3c" opacity="0.35" stroke="#4a4a4a" stroke-width="1"/>
  
  <!-- commands -->
  <text x="44" y="68" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#89b4fa" font-size="12" font-weight="700">$</text>
  <text x="60" y="68" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#ffffff" font-size="12">go install</text>
  <text x="148" y="68" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#89dceb" font-size="12">github.com/iSundram/Automergent@latest</text>

  <text x="44" y="94" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#89b4fa" font-size="12" font-weight="700">$</text>
  <text x="60" y="94" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#a6e3a1" font-size="12">automergent</text>

  <text x="44" y="120" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#89b4fa" font-size="12">✦</text>
  <text x="60" y="120" font-family="'SF Mono','Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" fill="#6c7086" font-size="11.5">type a prompt, /help for commands, or ctrl+p for command palette</text>

  <!-- separator -->
  <line x1="0" y1="159" x2="960" y2="159" stroke="#4a4a4a" stroke-width="1"/>
