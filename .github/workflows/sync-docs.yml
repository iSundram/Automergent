name: sync-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'install.sh'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to docs repo
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
        run: |
          git config --global user.email "deploy@automergent.github.io"
          git config --global user.name "Automergent Docs Bot"

          # Clone the docs repo
          git clone --depth 1 \
            https://x-access-token:${DOCS_TOKEN}@github.com/Automergent/automergent.github.io.git \
            /tmp/docs-repo

          # Sync docs-site content
          cd /tmp/docs-repo
          git rm -rf . 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/docs-site/* .
          # install.sh must live at the site root: the README's one-liner
          # fetches https://automergent.github.io/install.sh
          cp $GITHUB_WORKSPACE/install.sh .
          touch .nojekyll

          # Commit and push
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: sync from Automergent $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
          echo "Deployed to https://automergent.github.io"
