<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#d4d4d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#2b2b2b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Badge (64x64, rx=16) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="1.5" />

  <!-- Authentic 'A' Geometric Glyph (First letter of Automergent) -->
  <g transform="translate(32, 32) scale(0.72)">
    <polygon points="4.8279,-28.0825 -4.9143,-28.0825 -26.1921,28.0825 -14.2249,28.0825 -0.0608,-10.8516 14.2253,28.0825 26.1921,28.0825" fill="#ffffff" filter="url(#favGlow)" />
  </g>
</svg>