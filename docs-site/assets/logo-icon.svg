<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#d4d4d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2b2b2b" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#iconBg)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="10" y="10" width="80" height="80" rx="18" fill="none" stroke="#2b2b2b" stroke-width="1.5" />

  <!-- Left Chevron -->
  <path d="M 30 32 L 48 50 L 30 68" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Upper Branch -->
  <path d="M 56 30 L 72 48" stroke="#d4d4d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="56" cy="30" r="4" fill="#ffffff" />

  <!-- Lower Branch -->
  <path d="M 50 68 L 74 68" stroke="#b3b3b3" stroke-width="5" stroke-linecap="round" />
  <circle cx="72" cy="48" r="4" fill="#ffffff" />
</svg>