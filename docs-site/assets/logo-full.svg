<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 357 74" width="357" height="74" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#d4d4d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2b2b2b" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#b3b3b3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Badge (60x60, centered vertically at y=7) -->
  <g transform="translate(8, 7)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#iconBg)" stroke="url(#borderGrad)" stroke-width="1.75" />
    <rect x="3" y="3" width="54" height="54" rx="13" fill="none" stroke="#2b2b2b" stroke-width="1" />
    
    <!-- Chevron -->
    <path d="M 18 20 L 30 30 L 18 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Upper Node -->
    <path d="M 36 18 L 47 30" stroke="#d4d4d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="36" cy="18" r="3" fill="#ffffff" />
    
    <!-- Lower Merge Line -->
    <path d="M 30 42 L 47 42" stroke="#b3b3b3" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="47" cy="30" r="3" fill="#ffffff" />
  </g>

