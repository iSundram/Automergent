<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" width="380" height="76" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2b2b2b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="82" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#b3b3b3" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon badge: 60x60, centered in 76px height → y=8 -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="60" height="60" rx="15" fill="url(#iconBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Chevron (pointing right) -->
    <path d="M 16 18 L 30 30 L 16 42" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Top branch: from node at (37,16) down-right to convergence at (48,30) -->
    <circle cx="37" cy="16" r="3" fill="#ffffff" />
    <path d="M 37 16 L 48 30" stroke="#d4d4d4" stroke-width="3.5" stroke-linecap="round" />

    <!-- Bottom branch: horizontal from (30,44) to convergence at (48,44) -->
    <path d="M 30 44 L 48 44" stroke="#b3b3b3" stroke-width="3.5" stroke-linecap="round" />

    <!-- Convergence node -->
    <circle cx="48" cy="30" r="3.5" fill="#ffffff" />
    <path d="M 48 30 L 48 44" stroke="#d4d4d4" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="48" cy="44" r="3" fill="#d4d4d4" />
  </g>

