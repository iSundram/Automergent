<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 90" width="540" height="90" fill="none">
  <defs>
    <linearGradient id="fullIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2b" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <linearGradient id="fullBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#d4d4d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2b2b2b" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="textSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#b3b3b3" />
    </linearGradient>
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Badge -->
  <g transform="translate(8, 9)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#fullIconBg)" stroke="url(#fullBorderGrad)" stroke-width="1.75" />
    <rect x="3" y="3" width="66" height="66" rx="15" fill="none" stroke="#2b2b2b" stroke-width="1" />
    
    <!-- Chevron -->
    <path d="M 20 24 L 35 36 L 20 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fullGlow)" />
    
    <!-- Upper Branch -->
    <path d="M 42 22 L 56 36" stroke="#d4d4d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="42" cy="22" r="3.5" fill="#ffffff" />
    
    <!-- Lower Merge Line -->
    <path d="M 36 50 L 56 50" stroke="#b3b3b3" stroke-width="4" stroke-linecap="round" />
    <circle cx="56" cy="36" r="3.5" fill="#ffffff" />
  </g>

  <!-- Typography & Wordmark -->
  <g transform="translate(98, 0)">
    <!-- Auto (White) -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" fill="#ffffff">Auto</text>
    
    <!-- mergent (Silver gradient) -->
    <text x="104" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" fill="url(#textSilver)">mergent</text>

    <!-- Subtitle Pill -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="152" height="18" rx="4" fill="#2b2b2b" fill-opacity="0.75" stroke="#b3b3b3" stroke-width="0.75" stroke-opacity="0.35" />
      <text x="8" y="13" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1.2" fill="#d4d4d4">AUTONOMOUS AGENT</text>
      <circle cx="164" cy="9" r="2" fill="#b3b3b3" />
      <text x="174" y="13" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" letter-spacing="0.3" fill="#b3b3b3">AI Coding Engine</text>
    </g>
  </g>
</svg>